  <rect x="0" y="0"   width="1200" height="8" fill="#0bab64"/>
  <rect x="0" y="622" width="1200" height="8" fill="#0bab64"/>

  <!-- Title + hook -->
  <text class="title" x="600" y="54" text-anchor="middle">Secure, Scalable Home Web Hosting</text>
  <text class="hook"  x="600" y="84" text-anchor="middle">with HAProxy, pfSense, Let&#8217;s Encrypt &amp; Cloudflare</text>

