    <ellipse cx="70" cy="249" rx="8" ry="20"/>
    <line x1="50" y1="249" x2="90" y2="249"/>
  </g>
  <text class="gl" x="70" y="292" text-anchor="middle">Internet</text>
  <line x1="125" y1="249" x2="171" y2="249" stroke="#0bab64" stroke-width="4" marker-end="url(#ah)"/>

