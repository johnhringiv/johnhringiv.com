<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630">
  <defs>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 40px; font-weight: bold; fill: #2a2520; }
      .hook  { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; fill: #5c4033; }
      .name  { font-family: 'Segoe UI', Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #2a2520; }
      .small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #5c4033; }
      .be    { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 17px; fill: #2a2520; }
      .gl    { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; fill: #5c4033; }
      .cap   { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; font-style: italic; fill: #5c4033; }
      .branding { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; fill: #5c4033; }
    </style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#0bab64"/>
    </marker>
