name: CI

on:
  # Skip rebuilds for changes that never enter the image or affect CI (host-side
  # deploy scripts, docs, license). Anything in src/www/data/config/scripts/
  # Dockerfile/package*/tests/.github still triggers a build. Caveat: a v* tag on
  # a docs-only commit would also be skipped — cut release tags from commits with
  # real changes.
  push:
    branches: [main]
    tags: ["v*"] # a git tag publishes a matching image tag (v5 → :v5)
    paths-ignore: &ignore
      - '**/*.md'
      - 'deploy/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore: *ignore
  schedule:
    - cron: "17 4 3 * *" # monthly rebuild so the image picks up base-image CVE fixes

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the image build reads git history (sitemap/asset lastmod)
          lfs: true # images + data/cissp_results.json are Git LFS; the build needs real content, not pointers
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Building the image is itself a strong check: build_db.php's slug/date/
      # og-image validation, responsive image generation, and shiki highlighting
      # all run here and fail the build on any problem.
      - name: Build image
        run: docker build -t johnhringiv.com:latest .
      # Start the container and run the Chromium smoke suite (all pages 200,
      # CSS/JS/sprite load, no console errors, sprite completeness) against it.
      # The full multi-browser + static-analysis suite (`npm run test:docker`)
      # stays a local pre-push gate: several specs read built assets from
      # www/generated/ on disk, which exists inside the image, not on a clean
      # CI runner.
      - name: Smoke test (Chromium)
        run: |
          docker run -d -p 8082:8080 --name johnhringiv-ci johnhringiv.com:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:8082/nginx-health >/dev/null && break
            sleep 2
          done
          npx playwright test tests/e2e/smoke --project=chromium
      - name: Stop container
        if: always()
        run: docker rm -f johnhringiv-ci || true

  publish:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build reads git history — same as the checks job
          lfs: true # LFS content (images, cissp json) needed by the build — same as the checks job
      - uses: docker/setup-buildx-action@v4 # container driver; required for the gha build cache below
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # git tag v5 -> image :v5 (plain release number, no semver)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
