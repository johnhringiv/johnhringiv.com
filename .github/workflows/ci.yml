name: CI

on:
  # Skip rebuilds for changes that never enter the image or affect CI (host-side
  # deploy scripts, docs, license). Anything in src/www/data/config/scripts/
  # Dockerfile/package*/tests/.github still triggers a build. Caveat: a v* tag on
  # a docs-only commit would also be skipped — cut release tags from commits with
  # real changes.
  push:
    branches: [main]
    tags: ["v*"] # a git tag publishes a matching image tag (v5 → :v5)
    paths-ignore: &ignore
      - '**/*.md'
      - 'deploy/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore: *ignore
  schedule:
    - cron: "17 4 3 * *" # monthly rebuild so the image picks up base-image CVE fixes

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the image build reads git history (sitemap/asset lastmod)
          lfs: true # images + data/cissp_results.json are Git LFS; the build needs real content, not pointers
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The full suite runs every project in playwright.config.ts: chromium
      # (+ mobile/tablet viewports), firefox (strictest CSP enforcement), webkit
      # (Safari compatibility).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      # The html-validation specs POST rendered pages to a local W3C Nu
      # validator on :8888. Start it first so the (slow) Java servlet warms up
      # while the image builds below.
      - name: Start HTML validator
        run: docker run -d --name validator -p 8888:8888 ghcr.io/validator/validator
      # Building the image is itself a strong check: build_db.php's slug/date/
      # og-image validation, responsive image generation, and shiki highlighting
      # all run here and fail the build on any problem.
      - uses: docker/setup-buildx-action@v4 # container driver; required for the gha build cache below
      # Shares the GHA build cache with the publish job, so a push to main
      # doesn't pay for two cold multi-stage builds back-to-back (#4).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: . # path context, so the build sees .git (sitemap/asset lastmod)
          load: true # export to the local daemon so the E2E suite can run it below
          tags: johnhringiv.com:latest
          # The monthly scheduled run exists to pick up base-image/apk CVE
          # fixes; served from cache it would no-op, so bypass cache then.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d -p 8082:8080 --name johnhringiv-ci johnhringiv.com:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:8082/nginx-health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8082/nginx-health >/dev/null || { docker logs johnhringiv-ci; exit 1; }
          for i in $(seq 1 60); do
            curl -sf http://localhost:8888 >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8888 >/dev/null || { docker logs validator; exit 1; }
      # The complete E2E suite (same one `npm run test:docker` runs locally):
      # HTML/CSS validation, SEO, feeds, sitemap, accessibility, interactive
      # features, responsive design — all against the final container. CSS
      # validation fetches stylesheets over HTTP from the container, so no
      # locally built www/generated/ files are needed.
      - name: Run full E2E suite
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .build/playwright-report
          retention-days: 7
      - name: Stop containers
        if: always()
        run: docker rm -f johnhringiv-ci validator || true

  publish:
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'schedule')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build reads git history — same as the checks job
          lfs: true # LFS content (images, cissp json) needed by the build — same as the checks job
      - uses: docker/setup-buildx-action@v4 # container driver; required for the gha build cache below
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # git tag v5 -> image :v5 (plain release number, no semver)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'schedule' }} # monthly CVE rebuild must not be served from cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
