worker_processes auto;
error_log stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    # Treat files with unknown filetype as binary
    default_type application/octet-stream;

    # FastCGI cache configuration - cache until container restart
    fastcgi_cache_path /tmp/nginx_cache levels=1:2 keys_zone=html_cache:10m max_size=100m use_temp_path=off;

    # Define custom log format to include response times
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          '$request_time $upstream_response_time $pipe $upstream_cache_status';

    access_log /dev/stdout main_timed;
    error_log /dev/stderr notice;

    keepalive_timeout 65;

    # Write temporary files to /tmp so they can be created as a non-privileged user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Hide headers that identify the server to prevent information leakage
    proxy_hide_header X-Powered-By;
    fastcgi_hide_header X-Powered-By;
    server_tokens off;

    # Compression is handled by HAProxy
    gzip off;

    server {
        listen 8080 reuseport;
        server_name johnhringiv.com www.johnhringiv.com localhost;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        absolute_redirect off;

        root /var/www/html;
        index index.php index.html;
        error_page 404 /includes/404.php;

        location /nginx-health {
            access_log off;
            default_type text/plain;
            # __APP_VERSION__ is replaced at build time (Dockerfile) with
            # `git describe --tags --always`. HAProxy's OPTIONS http-check keys
            # off the 200 status, not the body, so the version is informational.
            return 200 "healthy __APP_VERSION__\n";
        }

        location / {
            if ($request_uri ~ ^/(.*)\.html$) { return 301 /$1; }
            if ($request_uri = /index) { return 301 /; }
            try_files $uri $uri/ $uri.html $uri.php$is_args$args;

            # Cache control
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            # Security headers
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        }

        # Deny access to includes directory
        location /includes {
            return 404;
        }

        # Redirect server error pages to the static page /50x.html
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/lib/nginx/html;
        }

        # Pass PHP scripts to PHP-FPM listening on php-fpm.sock
        location ~ \.php$ {
            if ($request_uri ~ ^/([^?]*)\.php($|\?)) { return 301 /$1$is_args$args; }
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_index index.php;
            include fastcgi_params;

            # FastCGI caching - server-side only, cleared on deployment
            fastcgi_cache html_cache;
            fastcgi_cache_key $scheme$request_method$host$request_uri;
            fastcgi_cache_valid 200 24h;
            fastcgi_cache_bypass $http_pragma $http_authorization;
            fastcgi_no_cache $http_pragma $http_authorization;

            # Cache and security headers
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            # CSP set by PHP (supports nonces for inline scripts)
        }

        # Long cache for static files (cache busting via query string)
        location ~* \.(jpg|jpeg|gif|png|svg|avif|woff|woff2|ttf|mp4|webp|ico|css|js)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        }

        # Deny access to dotfiles for security
        location ~ /\. {
            log_not_found off;
            deny all;
        }

        # Allow fpm ping and status from localhost
        location ~ ^/(fpm-status|fpm-ping)$ {
            access_log off;
            allow 127.0.0.1;
            deny all;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_pass unix:/run/php-fpm.sock;
        }
    }
}
