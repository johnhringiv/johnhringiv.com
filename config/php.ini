[PHP]
; Security
expose_php = Off
; php2shell (CVE-2026-109619) mitigation: session upload progress is the
; advisory's confirmed RCE path on PHP-FPM; PHP recommends leaving it off even
; after patching. This site never uses it.
session.upload_progress.enabled = Off
; php2shell CVE-2026-109619: fatal-error backtrace state is the advisory's
; confirmed RCE producer on PHP 8.5. Backtraces in fatal-error logs aren't needed.
fatal_error_backtraces = Off

; Timezone
date.timezone = UTC

[opcache]
; Enable OPcache
opcache.enable = 1
opcache.enable_cli = 0

; Memory settings
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000

; Production settings - files don't change at runtime
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Performance
opcache.fast_shutdown = 1
