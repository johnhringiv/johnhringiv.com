[PHP]
; Security
expose_php = Off
; php2shell (CVE-2026-109618 / CVE-2026-109619) mitigation: both bugs are in
; session upload-progress handling, which this site never uses.
session.upload_progress.enabled = Off

; Timezone
date.timezone = UTC

[opcache]
; Enable OPcache
opcache.enable = 1
opcache.enable_cli = 0

; Memory settings
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000

; Production settings - files don't change at runtime
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Performance
opcache.fast_shutdown = 1
